<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="robots" content="noindex, nofollow">
   <title>{% block title %}Request error | Martin Boxabl{% endblock %}</title>
   <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202b25; background: #f5f7f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .error-shell { width: min(100%, 680px); padding: clamp(28px, 7vw, 56px); border: 1px solid #e1e8e2; border-radius: 18px; background: #fff; box-shadow: 0 18px 55px #14251b12; text-align: center; }
      .error-brand { display: inline-block; margin-bottom: 34px; color: #24553a; font-weight: 750; text-decoration: none; }
      h1 { margin: 0 0 14px; font-size: clamp(30px, 6vw, 44px); line-height: 1.12; }
      p { margin: 0 auto 24px; max-width: 48ch; color: #5c6961; line-height: 1.65; }
      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 20px; border-radius: 8px; background: #24553a; color: #fff; font-weight: 650; text-decoration: none; }
      {% block extra_css %}{% endblock %}
   </style>
</head>
<body>
   <main class="error-shell">
      <a class="error-brand" href="/">Martin Boxabl</a>
      {% block content %}{% endblock %}
   </main>
</body>
</html>
